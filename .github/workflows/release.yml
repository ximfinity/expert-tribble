name: Release

# Push a tag like v1.1.0, or run this workflow from the Actions tab with a version, to build a
# signed APK, publish it as a GitHub Release (creating the tag if needed), and (when the itch.io
# secrets are set) upload it to itch.io with butler.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 1.1.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_TARGET: ${{ vars.ITCH_TARGET }} # e.g. yourname/phantomfloor:android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "::error::Version '$VERSION' must look like 1.1.0"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret SIGNING_KEYSTORE_BASE64 is not set (see RELEASING.md)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease testReleaseUnitTest :shared:jvmTest :shared:webZip --console=plain
          -PappVersionName="$VERSION" -PappVersionCode="${{ github.run_number }}"

      - name: Verify signature and rename
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "PhantomFloor-$VERSION.apk"
          cp "shared/build/dist/PhantomFloor-web-$VERSION.zip" .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: PhantomFloor ${{ env.VERSION }}
          files: |
            PhantomFloor-${{ env.VERSION }}.apk
            PhantomFloor-web-${{ env.VERSION }}.zip
          generate_release_notes: true

      - name: Upload to itch.io
        if: env.BUTLER_API_KEY != '' && env.ITCH_TARGET != ''
        run: |
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          ./butler/butler push "PhantomFloor-$VERSION.apk" "$ITCH_TARGET" --userversion "$VERSION"
          # The browser version goes to the same page's "html5" channel (e.g. you/game:html5).
          ./butler/butler push shared/build/dist/web "${ITCH_TARGET%:*}:html5" --userversion "$VERSION"

      - name: Note skipped itch.io upload
        if: env.BUTLER_API_KEY == '' || env.ITCH_TARGET == ''
        run: echo "::notice::itch.io upload skipped; set the BUTLER_API_KEY secret and ITCH_TARGET variable to enable it."
