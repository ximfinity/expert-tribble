name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK and run unit tests
        run: ./gradlew assembleDebug testDebugUnitTest :shared:jvmTest --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhantomFloor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
